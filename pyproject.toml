[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-maker-app"
version = "0.3.0"
description = "Windows 本地 AI 技术视频制作工作台"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "pydantic>=2,<3", "playwright>=1.48,<2", "imageio-ffmpeg==0.6.0", "edge-tts>=7.2,<8", "google-auth[requests]>=2.40,<3"]

[project.scripts]
video-maker = "video_app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_app = ["render/*.ps1", "assets/speech/*.mp3"]
